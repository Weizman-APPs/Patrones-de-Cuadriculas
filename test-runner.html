<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Runner</title>
</head>
<body>
  <div id="output">Running tests...</div>
  <canvas id="grid-canvas" width="420" height="420"></canvas>
  <script src="js/libs/jspdf.umd.min.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/canvas-editor.js"></script>
  <script src="js/pdf-generator.js"></script>
  <script>
    try {
      const results = [];
      // Test 1: jsPDF exists
      if (!window.jspdf || !window.jspdf.jsPDF) {
        throw new Error("jsPDF is not loaded");
      }
      results.push("Test 1: jsPDF loaded OK");

      // Test 2: PALETTE_PRESETS & PDF_SAMPLE_PATTERNS
      if (!PALETTE_PRESETS || !PDF_SAMPLE_PATTERNS || PDF_SAMPLE_PATTERNS.length !== 10) {
        throw new Error("PDF_SAMPLE_PATTERNS length != 10");
      }
      results.push("Test 2: Presets loaded OK (" + PDF_SAMPLE_PATTERNS.length + " patterns)");

      // Test 3: CanvasGridEditor instantiation
      const canvas = document.getElementById('grid-canvas');
      const editor = new CanvasGridEditor(canvas, {
        gridSize: 10,
        mode: 'routes',
        palette: PALETTE_PRESETS.pdfSample.colors
      });
      results.push("Test 3: CanvasGridEditor initialized OK");

      // Test 4: Load pattern 1
      editor.loadPattern(PDF_SAMPLE_PATTERNS[0]);
      if (editor.steps.length === 0) {
        throw new Error("Steps empty after loading pattern 1");
      }
      results.push("Test 4: Pattern 1 loaded (" + editor.steps.length + " steps)");

      // Test 5: Arrow rendering & options
      editor.setArrowOptions({ showArrows: true, arrowType: 'direction', arrowColor: 'auto' });
      editor.render();
      results.push("Test 5: Arrow rendering in canvas OK");

      // Test 6: Generate PDF
      const pages = PDF_SAMPLE_PATTERNS.map((p, idx) => ({
        title: p.name,
        mode: 'routes',
        gridSize: p.gridSize,
        steps: p.steps.map((st, sIdx) => ({
          r: st.r,
          c: st.c,
          color: PALETTE_PRESETS.pdfSample.colors[st.colorIndex % 3],
          step: sIdx + 1
        })),
        arrowOptions: {
          showArrows: true,
          arrowType: 'direction',
          arrowColor: 'auto'
        }
      }));

      const { doc, blobUrl } = window.patternPdfGenerator.generatePdf(pages, {
        format: 'a4',
        squareSizeSetting: 'medium',
        showGrid: false
      });

      if (!doc || !blobUrl) {
        throw new Error("PDF generation returned null doc or blobUrl");
      }
      results.push("Test 6: 10-page PDF generated successfully (pages=" + doc.getNumberOfPages() + ")");

      // Test 7: Random route generator
      const randomRoute = generateRandomRoute(10, 15, PALETTE_PRESETS.rainbow.colors, false);
      if (randomRoute.length < 5) {
        throw new Error("Random route generated too few steps");
      }
      results.push("Test 7: Random route generator OK (" + randomRoute.length + " steps)");

      // Test 8: Random color rotation mode
      editor.clear();
      editor.setColorRotationMode('random');
      editor.setPalette(PALETTE_PRESETS.rainbow.colors);
      editor.handleCellClickOrDrag(2, 2);
      editor.handleCellClickOrDrag(2, 3);
      editor.handleCellClickOrDrag(2, 4);
      if (editor.steps.length !== 3) {
        throw new Error("Expected 3 steps in random color test, got " + editor.steps.length);
      }
      const randomRouteColors = generateRandomRoute(10, 10, PALETTE_PRESETS.rainbow.colors, false, 'random');
      if (randomRouteColors.length < 5) {
        throw new Error("Random route with random colors failed");
      }
      results.push("Test 8: Random color rotation mode OK (3 steps drawn + random route verified)");

      document.getElementById('output').innerText = "SUCCESS\n" + results.join("\n");
      console.log("ALL_TESTS_PASSED");
    } catch (e) {
      document.getElementById('output').innerText = "ERROR: " + e.message + "\n" + e.stack;
      console.error(e);
    }
  </script>
</body>
</html>
